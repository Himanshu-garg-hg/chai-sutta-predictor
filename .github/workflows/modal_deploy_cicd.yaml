name: chai-sutta-predictor CI/CD
run-name: chai-sutta-predictor CI/CD by ${{ github.actor }} with model version - ${{ github.run_number }}
on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  modal_training_upload_storage_account:
    name: modal training ci
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chai-sutta-modal/requirements.txt
          

      - name: Run training script
        run: |
          echo "Training ML Model with version: v${{ github.run_number }}"
          python chai-sutta-modal/src/train_model.py
        env:
          MODEL_VERSION: v${{ github.run_number }}

      - name: artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: models
          path: chai-sutta-modal/

      - name: az login using federated credentials
        uses: azure/login@v1
        with:
          client-id: "6863db71-fcbf-4466-8046-997de5b919c3"
          tenant-id: "9fc5e873-a267-48bf-a6dd-9c332cf29837"
          subscription-id: "a5e53954-5571-4fa4-9dd5-bfc7eda513a4"

      - name: Upload models to storage account
        run: |
          az storage blob upload-batch  -d 'chai-sutta-container' --account-name 'modalstorageacc' -s './chai-sutta-modal/models'


  modal_image_build:
    name: modal image build
    runs-on: ubuntu-latest
    needs: modal_training_upload_storage_account
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
    
      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Debug - Show MODEL_VERSION
        run: |
          echo "MODEL_VERSION : v${{ github.run_number }}"

      - name: copy model files from previous job
        uses: actions/download-artifact@v4
        with:
          name: models
          path: ./chai-sutta-modal/

      - run: ls -R ./chai-sutta-modal/

      - name: az login using federated credentials
        uses: azure/login@v1
        with:
          client-id: "6863db71-fcbf-4466-8046-997de5b919c3"
          tenant-id: "9fc5e873-a267-48bf-a6dd-9c332cf29837"
          subscription-id: "a5e53954-5571-4fa4-9dd5-bfc7eda513a4"
      
      - name: Login to ACR
        run: |
            az acr login --name modalacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: ./chai-sutta-modal
          push: true
          tags: |
            modalacr.azurecr.io/chai-sutta-predictor-image:v${{ github.run_number }}
            modalacr.azurecr.io/chai-sutta-predictor-image:latest

      - name: Run Docker container to list model files
        run: |
          docker run -it modalacr.azurecr.io/chai-sutta-predictor-image:v${{ github.run_number }} ls /app/models

  modal_deployment_kubernetes:
    name: modal deployment on kubernetes
    runs-on: ubuntu-latest
    needs: modal_image_build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: az login using federated credentials
        uses: azure/login@v1
        with:
          client-id: "6863db71-fcbf-4466-8046-997de5b919c3"
          tenant-id: "9fc5e873-a267-48bf-a6dd-9c332cf29837"
          subscription-id: "a5e53954-5571-4fa4-9dd5-bfc7eda513a4"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v1
        with:
          version: 'latest'

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group k8_modal_rg --name k8_modal_aks

      - name: Deploy to AKS using kubectl
        run: |
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml

      - name: update image in deployment
        run: |
          kubectl set image deployment/chai-sutta-modal-deployment chai-sutta-modal-container=modalacr.azurecr.io/chai-sutta-predictor-image:v${{ github.run_number }}

      - name: wait for service public IP
        run: |
          for i in {1..60}; do
            IP=$(kubectl get service chai-sutta-modal-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then
              echo "public IP: $IP"
              exit 0
            fi
            echo "waiting for public IP..."
            sleep 10
          done
          echo "timed out waiting for public IP" >&2
          exit 1
